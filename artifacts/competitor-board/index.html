<title>Competitor Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  /* One deliberate look: white paper, black ink, grey structure, red only where it means "this one". */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f4f4f5;
    --surface-2: #ebebed;
    --line: #e4e4e7;
    --ink: #0c0c0d;
    --muted: #66666d;
    --faint: #a3a3aa;
    --red: #e11d2e;
    --red-ink: #c0121f;
    --red-soft: #fdebed;
    --font: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 15px/1.4 var(--font); padding-inline: 16px; padding-block: 24px 56px; }
  button, input, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 6px; }

  .shell { max-width: 1480px; margin: 0 auto; display: grid; gap: 24px; }
  header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .mark { width: 34px; height: 24px; flex: none; }
  .tabs { display: inline-flex; gap: 24px; }
  .tabs button { border: 0; background: none; padding: 0 0 14px; color: var(--muted); cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }
  .tabs button:hover { color: var(--ink); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 24px; align-items: start; }
  @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } .side { order: -1; } }

  .panel { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 24px; min-width: 0; }
  .panel.side { background: var(--surface); border-color: transparent; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .panel-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }

  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14.5px; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--surface-2); position: relative; transition: background .15s; flex: none; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .switch input:checked + .track { background: var(--red); }
  .switch input:checked + .track::after { transform: translateX(14px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--red); outline-offset: 2px; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
  .filters .switch { margin-left: auto; color: var(--muted); }
  .select { position: relative; }
  .select select { appearance: none; background: var(--surface); border: 1px solid transparent; border-radius: 999px; padding: 9px 36px 9px 16px; cursor: pointer; font-weight: 500; }
  .select select:hover { border-color: var(--line); }
  .select::after { content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .search { background: var(--surface); border: 1px solid transparent; border-radius: 999px; padding: 9px 16px; min-width: 0; flex: 1 1 200px; max-width: 300px; }
  .search:focus { background: var(--bg); border-color: var(--line); }
  .search::placeholder { color: var(--faint); }

  .table-wrap { margin-top: 20px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; font-variant-numeric: tabular-nums; }
  thead th { color: var(--muted); font-weight: 600; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; text-align: left; padding: 12px 20px; white-space: nowrap; border-bottom: 1.5px solid var(--ink); }
  thead th.num { text-align: center; }
  th button { background: none; border: 0; color: inherit; cursor: pointer; padding: 0; display: inline-flex; gap: 6px; align-items: center; font: inherit; letter-spacing: inherit; text-transform: inherit; }
  th button[data-active="true"] { color: var(--ink); }
  .arrow { font-size: 10px; }
  th button[data-active="true"] .arrow { color: var(--red); }
  tbody td { padding: 14px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:hover td { background: #fafafa; }
  td.num { text-align: center; white-space: nowrap; font-weight: 500; }
  .vid { display: flex; gap: 20px; align-items: center; min-width: 0; }
  .thumb { width: 144px; aspect-ratio: 16 / 9; border-radius: 8px; flex: none; background: var(--surface); position: relative; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dur { position: absolute; right: 5px; bottom: 5px; background: rgba(12,12,13,.85); color: #fff; font-size: 11px; padding: 1px 5px; border-radius: 4px; font-weight: 600; }
  .vid-title { font-weight: 600; font-size: 15.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vid-title:hover { text-decoration: underline; text-decoration-color: var(--red); text-underline-offset: 3px; }
  .meta { color: var(--muted); margin-top: 3px; font-size: 14px; }
  .own-tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--red); margin-left: 6px; }
  .ad-tag { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12px; font-weight: 600; color: #3a3a40; background: var(--surface); padding: 2px 9px; border-radius: 999px; }
  .ad-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }

  .pill { display: inline-block; min-width: 52px; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; text-align: center; background: var(--surface); color: #3a3a40; }
  .pill.hot { background: var(--red); color: #fff; }
  .pill.warm { background: var(--ink); color: #fff; }
  .pill.na { background: none; color: var(--faint); }
  .pill.ad { background: none; color: var(--faint); border: 1px dashed var(--faint); text-decoration: line-through; }

  .more { display: flex; justify-content: center; margin-top: 18px; }
  .btn { background: var(--surface); border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; font-weight: 600; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary:hover { background: var(--red); }
  .btn.small { padding: 6px 12px; font-size: 13.5px; background: var(--bg); border: 1px solid var(--line); }
  .btn.small:hover { border-color: var(--ink); }
  .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 18px; color: var(--muted); font-size: 13px; align-items: center; }
  .legend .pill { min-width: 0; font-size: 12px; padding: 2px 8px; margin-right: 4px; }
  .footnote { color: var(--muted); font-size: 13px; margin-top: 12px; max-width: 90ch; line-height: 1.5; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }

  .side h3 { margin: 0 0 14px; font-size: 18px; font-weight: 700; }
  .add { background: var(--bg); border-radius: 12px; padding: 16px; display: grid; gap: 10px; border: 1px solid var(--line); }
  .add label { color: var(--muted); font-size: 14px; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .add-row input:focus { border-color: var(--ink); outline: none; }
  .add-msg { font-size: 13px; color: var(--muted); min-height: 1em; }
  .add-msg.err { color: var(--red-ink); }
  .check-all { display: flex; align-items: center; gap: 12px; margin: 20px 0 10px; padding-inline: 12px; font-weight: 600; cursor: pointer; }
  .chan-list { background: var(--bg); border-radius: 12px; padding: 6px 0; max-height: 660px; overflow-y: auto; border: 1px solid var(--line); }
  .chan { display: flex; align-items: center; gap: 12px; padding: 9px 12px; cursor: pointer; }
  .chan:hover { background: var(--surface); }
  .chan .name { font-weight: 600; line-height: 1.25; }
  .chan .subs { color: var(--muted); font-size: 13.5px; }
  .chan .count { margin-left: auto; color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--surface-2); object-fit: cover; display: grid; place-items: center; font-weight: 700; color: var(--muted); }
  input[type="checkbox"] { appearance: none; width: 19px; height: 19px; border-radius: 5px; border: 1.5px solid var(--faint); background: var(--bg); flex: none; display: grid; place-items: center; cursor: pointer; margin: 0; }
  input[type="checkbox"]:checked, input[type="checkbox"]:indeterminate { background: var(--red); border-color: var(--red); }
  input[type="checkbox"]:checked::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  input[type="checkbox"]:indeterminate::after { content: ""; width: 9px; height: 2px; background: #fff; }

  .roster { display: grid; margin-top: 20px; }
  .roster-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--line); }
  .roster-row .handle { color: var(--muted); font-size: 14px; }
  .status { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--surface); color: var(--ink); }
  .status.pending { color: var(--muted); background: none; border: 1px dashed var(--faint); }
  .status.error { background: var(--red-soft); color: var(--red-ink); }
  .sync-note { background: var(--surface); border-radius: 12px; padding: 16px 18px; margin-top: 20px; color: var(--muted); line-height: 1.5; }
  .sync-note code { background: var(--bg); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; color: var(--ink); font-size: 14px; }
  /* plan: a sheet, not a form */
  .plan-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 20px; }
  .pillars { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .pillar-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13.5px; }
  .pillar-chip b { font-variant-numeric: tabular-nums; }
  .pillar-chip b.off { color: var(--red-ink); }
  .pillar-chip input { border: 0; background: var(--bg); border-radius: 999px; padding: 4px 10px; width: 11ch; font-weight: 600; }
  .pillar-chip input:focus { outline: 1.5px solid var(--ink); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .sheet-wrap { margin-top: 16px; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table.sheet { table-layout: fixed; border-collapse: collapse; width: max-content; min-width: 100%; font-size: 14px; }
  .sheet th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap; }
  .sheet td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; vertical-align: top; background: var(--bg); }
  .sheet th:last-child, .sheet td:last-child { border-right: 0; }
  .sheet tr:last-child td { border-bottom: 0; }
  .sheet th { position: sticky; }
  .sheet th .grip { position: absolute; top: 0; right: 0; width: 9px; height: 100%; cursor: col-resize; z-index: 1; touch-action: none; }
  .sheet th .grip::after { content: ""; position: absolute; left: 4px; top: 25%; height: 50%; width: 1px; background: transparent; }
  .sheet th:hover .grip::after, .sheet th .grip.on::after { background: var(--red); width: 2px; }
  .sheet th, .sheet td { overflow: hidden; }
  .refs { display: grid; gap: 8px; padding: 8px 10px; }
  .fref { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 6px; align-items: start; }
  .fref a { font-weight: 600; line-height: 1.3; }
  .fref a:hover { text-decoration: underline; text-decoration-color: var(--red); }
  .fref small { color: var(--muted); grid-column: 1; }
  .fref .x { grid-row: 1 / span 2; grid-column: 2; border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .fref .x:hover { color: var(--red); }
  .refs input { padding: 4px 0; min-height: 0; color: var(--muted); font-size: 13px; }
  .sheet td.n { width: 38px; text-align: center; color: var(--faint); font-weight: 700; padding-top: 11px; background: var(--surface); }
  .sheet textarea, .sheet input, .sheet select { width: 100%; border: 0; background: transparent; padding: 10px; font: inherit; resize: none; display: block; min-height: 40px; }
  .sheet textarea { field-sizing: content; min-height: 40px; line-height: 1.35; }
  .sheet textarea:focus, .sheet input:focus, .sheet select:focus { outline: 2px solid var(--ink); outline-offset: -2px; background: #fff; }
  .sheet select { appearance: none; cursor: pointer; }
  .sheet .c-title textarea { font-weight: 600; }
  .ref { display: grid; gap: 4px; padding: 8px 10px; }
  .ref a { font-weight: 600; line-height: 1.3; }
  .ref a:hover { text-decoration: underline; text-decoration-color: var(--red); }
  .ref small { color: var(--muted); }
  .ref input { padding: 4px 0; min-height: 0; color: var(--muted); font-size: 13px; }
  .st { font-weight: 600; }
  .est { display: grid; gap: 2px; padding: 6px 10px; }
  .est input { padding: 2px 0; min-height: 0; font-variant-numeric: tabular-nums; }
  .est .mid { font-weight: 700; font-size: 15px; }
  .est .range { display: flex; gap: 4px; align-items: center; color: var(--muted); font-size: 12.5px; }
  .est .range input { width: 7ch; color: var(--muted); }
  .vs { display: block; padding: 0 10px 8px; font-size: 12.5px; font-weight: 700; }
  .vs.up { color: var(--red); }
  .vs.down { color: var(--muted); }
  .st-publicado, .st-published { color: var(--ink); }
  .saving { color: var(--faint); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 5; }
  .plan-add { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; font-size: 12px; font-weight: 600; padding: 1px 8px; margin-left: 8px; cursor: pointer; color: var(--muted); vertical-align: 1px; }
  .plan-add:hover { border-color: var(--red); color: var(--red); }
  @media (max-width: 560px) {
    .panel { padding: 16px; }
    .roster-row { grid-template-columns: 36px minmax(0, 1fr); }
    .roster-row .status, .roster-row .btn { grid-column: 2; justify-self: start; }
    .filters .switch { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 34 24" aria-hidden="true"><rect width="34" height="24" rx="6" fill="#e11d2e"/><path d="M14 7v10l8-5z" fill="#fff"/></svg>
      <h1 data-t="title"></h1>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-videos" aria-selected="true" data-view="videos" data-t="tabVideos"></button>
      <button role="tab" id="tab-plan" aria-selected="false" data-view="plan" data-t="tabPlan"></button>
      <button role="tab" id="tab-list" aria-selected="false" data-view="list" data-t="tabList"></button>
    </div>
  </header>

  <div class="layout" id="view-videos">
    <section class="panel">
      <div class="panel-head">
        <h2 data-t="bestVideos"></h2>
        <label class="switch"><input type="checkbox" id="own-toggle" checked><span class="track"></span><span data-t="includeOwn"></span></label>
      </div>
      <div class="filters">
        <div class="select"><select id="sort" data-t-aria="sortBy">
          <option value="ratio" data-t="colOutlier"></option>
          <option value="views" data-t="colViews"></option>
          <option value="vph" data-t="colVph"></option>
          <option value="date" data-t="newest"></option>
        </select></div>
        <div class="select"><select id="period" data-t-aria="period">
          <option value="7" data-t="p7"></option>
          <option value="30" data-t="p30"></option>
          <option value="90" data-t="p90"></option>
          <option value="183" data-t="p183" selected></option>
        </select></div>
        <input class="search" id="q" type="search" data-t-ph="search" data-t-aria="search">
        <label class="switch" data-t-title="adsHelp"><input type="checkbox" id="ads-toggle" checked><span class="track"></span><span id="ads-label"></span></label>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th><span data-t="colVideos"></span> <span id="count" style="color:var(--faint)"></span></th>
            <th class="num"><button data-sort="views"><span data-t="colViews"></span> <span class="arrow"></span></button></th>
            <th class="num"><button data-sort="ratio"><span data-t="colOutlier"></span> <span class="arrow"></span></button></th>
            <th class="num"><button data-sort="vph"><span data-t="colVph"></span> <span class="arrow"></span></button></th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="4" class="empty" data-t="loading"></td></tr></tbody>
        </table>
      </div>
      <div class="more"><button class="btn" id="more" hidden data-t="more"></button></div>
      <div class="legend">
        <span><span class="pill hot">3x</span><span data-t="legendHot"></span></span>
        <span><span class="pill warm">2x</span><span data-t="legendWarm"></span></span>
        <span><span class="pill">1x</span><span data-t="legendNormal"></span></span>
        <span><span class="pill ad">9x</span><span data-t="legendAd"></span></span>
      </div>
      <p class="footnote" id="footnote"></p>
    </section>

    <aside class="panel side">
      <h3 data-t="addTitle"></h3>
      <form class="add" id="add-form-side">
        <label for="add-side" data-t="addLabelShort"></label>
        <div class="add-row"><input id="add-side" placeholder="@channel" autocomplete="off"><button class="btn primary" type="submit" data-t="add"></button></div>
        <div class="add-msg" id="add-msg-side"></div>
      </form>
      <label class="check-all"><input type="checkbox" id="all"><span data-t="selectAll"></span></label>
      <div class="chan-list" id="chan-list"></div>
    </aside>
  </div>

  <section class="panel" id="view-plan" hidden>
    <div class="panel-head"><h2 data-t="planTitle"></h2><span class="saving" id="plan-saving"></span></div>
    <div class="plan-bar">
      <div class="select"><select id="plan-month" data-t-aria="planMonth"></select></div>
      <button class="btn" type="button" id="plan-new" data-t="planNew"></button>
    </div>
    <div class="pillars" id="pillars"></div>
    <div class="sheet-wrap">
      <table class="sheet">
        <colgroup id="plan-cols">
          <col data-col="n"><col data-col="pillar"><col data-col="title"><col data-col="pattern"><col data-col="ref">
          <col data-col="refs"><col data-col="tam"><col data-col="expected"><col data-col="real"><col data-col="status">
        </colgroup>
        <thead><tr>
          <th>#</th><th data-t="hPillar"></th><th data-t="hTitle"></th><th data-t="hPattern"></th><th data-t="hRef"></th>
          <th data-t="hNotes"></th><th data-t="hTam"></th><th data-t="hExpected"></th><th data-t="hReal"></th><th data-t="hStatus"></th>
        </tr></thead>
        <tbody id="plan-rows"><tr><td colspan="10" class="empty" data-t="planEmpty"></td></tr></tbody>
      </table>
    </div>
    <p class="footnote" data-t="planFoot"></p>
  </section>

  <section class="panel" id="view-list" hidden>
    <div class="panel-head"><h2 data-t="listTitle"></h2><span id="roster-count" style="color:var(--muted)"></span></div>
    <form class="add" id="add-form-list" style="margin-top:20px;max-width:560px">
      <label for="add-list" data-t="addLabel"></label>
      <div class="add-row"><input id="add-list" placeholder="@channel" autocomplete="off"><button class="btn primary" type="submit" data-t="add"></button></div>
      <div class="add-msg" id="add-msg-list"></div>
    </form>
    <div class="roster" id="roster"></div>
    <div class="sync-note" id="sync-note"></div>
  </section>
</div>

<script>
(() => {
  const $ = (s) => document.getElementById(s);
  const PAGE = 60;

  // ---------- copy, in the language set in config/config.json ----------
  const T = {
    es: {
      locale: "es-ES", title: "Competidores", tabVideos: "Vídeos", tabPlan: "Plan mensual", tabList: "Lista de competidores",
      planTitle: "Plan de vídeos del mes", planMonth: "Mes", planNew: "Añadir el mes siguiente", planEmpty: "Todavía no hay ningún mes planificado.",
      hPillar: "Pilar", hTitle: "Título provisional", hPattern: "Patrón", hRef: "Referencia principal", hTam: "TAM (vistas del tema, 6 meses)", hStatus: "Estado", hNotes: "Referencias del formato",

  let L = T[(navigator.language || "en").slice(0, 2)] || T.en;
  let f = null;
  function setLang(code) {
    L = T[code] || L;
    const int = new Intl.NumberFormat(L.locale);
    const dec = new Intl.NumberFormat(L.locale, { maximumFractionDigits: 1 });
    const date = new Intl.DateTimeFormat(L.locale, { day: "numeric", month: "short", year: "numeric" });
    f = { int: (n) => int.format(n), dec: (n) => dec.format(n), date: (iso) => date.format(new Date(iso)) };
    document.documentElement.lang = code;
    document.querySelectorAll("[data-t]").forEach(n => { n.textContent = L[n.dataset.t]; });
    document.querySelectorAll("[data-t-aria]").forEach(n => n.setAttribute("aria-label", L[n.dataset.tAria]));
    document.querySelectorAll("[data-t-ph]").forEach(n => n.setAttribute("placeholder", L[n.dataset.tPh]));
    document.querySelectorAll("[data-t-title]").forEach(n => n.setAttribute("title", L[n.dataset.tTitle]));
    $("sync-note").innerHTML = L.syncNote;
  }
  setLang((navigator.language || "en").slice(0, 2) in T ? (navigator.language || "en").slice(0, 2) : "en");

  const state = {
    data: null,            // index.json + the loaded ch/*.json videos
    roster: null,          // db docs {key, handle, enabled, addedAt}; null = no shared store in this view
    includeOwn: true, hideAds: true,
    sort: "ratio", period: 183, q: "", shown: PAGE,
    db: null,
  };

  // ---------- helpers ----------
  const normKey = (raw) => {
    let s = (raw || "").trim();
    const m = s.match(/youtube\.com\/(@[\w.\-]+)/i);
    if (m) s = m[1];
    s = s.replace(/^@/, "").toLowerCase();
    return /^[a-z0-9._\-]{3,100}$/.test(s) ? s : null;
  };
  const subsLabel = (n) => n == null ? "" : L.subs(n, f);
  const ago = (iso) => L.ago(Math.floor((Date.now() - new Date(iso)) / 864e5));
  const times = (r) => (r >= 10 ? f.int(Math.round(r)) : f.dec(r)) + "x";
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  const avatar = (ch, fallback) => ch?.avatar
    ? el("img", { class: "avatar", src: ch.avatar, alt: "" })
    : el("span", { class: "avatar", text: (fallback || "?").replace(/^@/, "").slice(0, 1).toUpperCase() });
  const saveLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const loadLocal = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };

  // ---------- derived ----------
  const channelsByKey = () => new Map((state.data?.channels || []).filter(c => !c.error).map(c => [c.key, c]));
  const ownChannel = () => (state.data?.channels || []).find(c => c.own && !c.error);

  // The stored list merged with the synced data.
  function competitorRows() {
    const byKey = channelsByKey();
    if (state.roster) {
      return state.roster.map(r => ({ ...r, ch: byKey.get(r.key) || null,
        failed: (state.data?.channels || []).some(c => c.error && c.key === r.key) }));
    }
    // No shared store: fall back to the synced channels, with ticks remembered in this browser.
    const off = new Set(loadLocal("board-off", []));
    return [...byKey.values()].filter(c => !c.own)
      .map(c => ({ key: c.key, handle: c.handle, enabled: !off.has(c.key), ch: c, failed: false }));
  }

  function visibleVideos() {
    const on = new Set(competitorRows().filter(r => r.enabled && r.ch).map(r => r.key));
    const own = ownChannel();
    if (own && state.includeOwn) on.add(own.key);
    const cutoff = Date.now() - state.period * 864e5;
    const q = state.q.trim().toLowerCase();
    const inScope = (state.data?.videos || []).filter(v =>
      on.has(v.ch) && new Date(v.published_at) >= cutoff && (!q || v.title.toLowerCase().includes(q)));
    state.adsInScope = inScope.filter(v => v.ad_suspect).length;
    const list = state.hideAds ? inScope.filter(v => !v.ad_suspect) : inScope;
    const key = { ratio: v => v.ratio ?? -1, views: v => v.views, vph: v => v.vph, date: v => +new Date(v.published_at) }[state.sort];
    return list.sort((a, b) => key(b) - key(a));
  }

  // ---------- render ----------
  function pill(r, ad) {
    if (r == null) return el("span", { class: "pill na", text: "—" });
    if (ad) return el("span", { class: "pill ad", title: L.adPill, text: times(r) });
    return el("span", { class: r >= 3 ? "pill hot" : r >= 2 ? "pill warm" : "pill", text: times(r) });
  }

  function renderVideos() {
    if (!state.data) return;
    const tbody = $("rows");
    const byKey = channelsByKey();
    const list = visibleVideos();
    $("count").textContent = `· ${f.int(list.length)}` + (loading.size ? ` · ${L.loadingShort}` : "");
    tbody.replaceChildren();
    if (!list.length && !loading.size) tbody.append(el("tr", {}, el("td", { colspan: 4, class: "empty", text: L.noVideos })));
    for (const v of list.slice(0, state.shown)) {
      const ch = byKey.get(v.ch);
      const url = `https://www.youtube.com/watch?v=${v.id}`;
      const share = v.like_share != null ? Math.round(v.like_share * 100) : null;
      tbody.append(el("tr", {},
        el("td", {}, el("div", { class: "vid" },
          el("a", { class: "thumb", href: url, target: "_blank", rel: "noopener", "aria-label": v.title },
            v.thumb ? el("img", { src: v.thumb, alt: "", loading: "lazy" }) : null,
            el("span", { class: "dur", text: v.duration })),
          el("div", { style: "min-width:0" },
            el("a", { class: "vid-title", href: url, target: "_blank", rel: "noopener", text: v.title }),
            el("div", { class: "meta" }, `${ch?.title || v.ch} • ${subsLabel(ch?.subs)}`,
              ch?.own ? el("span", { class: "own-tag", text: L.yourChannel }) : null,
              state.db ? el("button", { class: "plan-add", type: "button", text: L.addToPlan, onclick: () => addToPlan(v, ch) }) : null),
            el("div", { class: "meta" }, `${ago(v.published_at)} · ${f.date(v.published_at)}` + (v.paid ? ` · ${L.paid}` : "")),
            v.ad_suspect ? el("span", { class: "ad-tag", title: L.adTitle(f.dec(v.lpk), share), text: L.adTag(share) }) : null))),
        el("td", { class: "num", text: f.int(v.views) }),
        el("td", { class: "num" }, pill(v.ratio, v.ad_suspect)),
        el("td", { class: "num", text: f.dec(v.vph) })));
    }
    $("more").hidden = list.length <= state.shown;
    $("ads-label").textContent = L.hideAds(state.adsInScope || 0);
    document.querySelectorAll("th button[data-sort]").forEach(b => {
      const on = b.dataset.sort === state.sort;
      b.dataset.active = on;
      b.querySelector(".arrow").textContent = on ? "▼" : "↕";
    });
    $("sort").value = state.sort;
  }

  function renderChecklist() {
    const box = $("chan-list");
    const rows = competitorRows();
    const counts = {};
    const cutoff = Date.now() - state.period * 864e5;
    for (const v of state.data?.videos || []) if (new Date(v.published_at) >= cutoff) counts[v.ch] = (counts[v.ch] || 0) + 1;
    box.replaceChildren();
    if (!rows.length) box.append(el("div", { class: "empty", text: L.firstOne }));
    for (const r of rows) {
      const id = "chk-" + r.key;
      box.append(el("label", { class: "chan", for: id },
        el("input", { type: "checkbox", id, checked: r.enabled, onchange: (e) => setEnabled(r.key, e.target.checked) }),
        avatar(r.ch, r.handle),
        el("div", { style: "min-width:0" },
          el("div", { class: "name", text: r.ch?.title || r.handle }),
          el("div", { class: "subs", text: r.ch ? subsLabel(r.ch.subs) : r.failed ? L.notFound : L.pendingSync })),
        r.ch && loaded.has(r.key) ? el("span", { class: "count", title: L.inPeriod, text: counts[r.key] || 0 }) : null));
    }
    const on = rows.filter(r => r.enabled).length;
    $("all").checked = rows.length > 0 && on === rows.length;
    $("all").indeterminate = on > 0 && on < rows.length;
  }

  const confirming = new Set();
  function renderRoster() {
    const box = $("roster");
    const rows = competitorRows();
    $("roster-count").textContent = L.channels(rows.length);
    box.replaceChildren();
    for (const r of rows) {
      const status = r.ch ? el("span", { class: "status", text: L.videosN(r.ch.n_videos) })
        : r.failed ? el("span", { class: "status error", text: L.notFound })
        : el("span", { class: "status pending", text: L.pending });
      const ask = confirming.has(r.key);
      box.append(el("div", { class: "roster-row" },
        avatar(r.ch, r.handle),
        el("div", { style: "min-width:0" },
          el("div", { style: "font-weight:600", text: r.ch?.title || r.handle }),
          el("div", { class: "handle", text: [r.ch?.handle || r.handle, r.ch ? subsLabel(r.ch.subs) : null].filter(Boolean).join(" · ") })),
        status,
        state.roster ? el("button", { class: ask ? "btn small danger" : "btn small", type: "button",
          text: ask ? L.confirm : L.remove,
          onclick: () => ask ? removeCompetitor(r.key) : (confirming.add(r.key), renderRoster(),
            setTimeout(() => { confirming.delete(r.key); renderRoster(); }, 4000)) }) : el("span")));
    }
  }

  function renderAll() {
    renderVideos(); renderChecklist(); renderRoster();
    $("own-toggle").closest(".switch").hidden = !ownChannel();
    $("own-toggle").checked = state.includeOwn;
    if (state.data) $("footnote").textContent = L.foot(state.data, f);
  }

  // ---------- per-channel data, fetched only when a channel is switched on ----------
  const loaded = new Set(), loading = new Set();
  function ensureLoaded() {
    if (!state.data) return;
    const byKey = channelsByKey();
    const want = competitorRows().filter(r => r.enabled && byKey.has(r.key)).map(r => r.key);
    const own = ownChannel();
    if (own && state.includeOwn) want.push(own.key);
    const todo = want.filter(k => !loaded.has(k) && !loading.has(k));
    if (!todo.length) return;
    todo.forEach(k => loading.add(k));
    renderVideos();
    Promise.all(todo.map(k => fetch("ch/" + encodeURIComponent(k) + ".json")
      .then(r => r.ok ? r.json() : []).catch(() => [])
      .then(vs => { loading.delete(k); loaded.add(k); state.data.videos.push(...vs); })))
      .then(() => renderAll());
  }

  // ---------- writes ----------
  async function setEnabled(key, enabled) {
    if (state.roster) {
      const r = state.roster.find(x => x.key === key); if (r) r.enabled = enabled;
      renderAll(); ensureLoaded();
      try { await state.db.doc("competitors/" + key).update({ enabled }); } catch (e) { console.warn(e); }
    } else {
      const off = new Set(loadLocal("board-off", []));
      enabled ? off.delete(key) : off.add(key);
      saveLocal("board-off", [...off]); renderAll(); ensureLoaded();
    }
  }
  async function setAll(enabled) {
    if (!state.roster) { saveLocal("board-off", enabled ? [] : competitorRows().map(r => r.key)); renderAll(); return ensureLoaded(); }
    const rows = state.roster.filter(r => r.enabled !== enabled);
    rows.forEach(r => { r.enabled = enabled; });
    renderAll(); ensureLoaded();
    for (const r of rows) { try { await state.db.doc("competitors/" + r.key).update({ enabled }); } catch (e) { console.warn(e); } }
  }
  async function addCompetitor(raw, msgEl, input) {
    msgEl.className = "add-msg";
    const key = normKey(raw);
    if (!key) { msgEl.className = "add-msg err"; msgEl.textContent = L.badHandle; return; }
    if (!state.db || !state.roster) { msgEl.className = "add-msg err"; msgEl.textContent = L.noDb; return; }
    if (state.roster.some(r => r.key === key)) { msgEl.textContent = L.already(key); return; }
    try {
      await state.db.doc("competitors/" + key).set({ handle: "@" + key, enabled: true, addedAt: new Date().toISOString() });
      input.value = "";
      msgEl.textContent = channelsByKey().has(key) ? L.added(key) : L.addedPending(key);
    } catch (e) {
      msgEl.className = "add-msg err";
      msgEl.textContent = e?.code === "quota_exceeded" ? L.full : L.saveFail;
    }
  }
  async function removeCompetitor(key) {
    confirming.delete(key);
    try { await state.db.doc("competitors/" + key).delete(); } catch (e) { console.warn(e); }
  }

  // ---------- monthly plan ----------
  const PILLAR_COLORS = ["#e11d2e", "#0c0c0d", "#7a7a82", "#c9c9cf"];
  const SLOTS = 8, PER_PILLAR = 2;
  const plan = { rows: [], pillars: [], month: loadLocal("board-plan-month", null) };
  const pending = new Map();   // doc id -> {timer, patch}
  let toastTimer;
  function toast(msg) {
    let t = document.querySelector(".toast");
    if (!t) { t = el("div", { class: "toast", role: "status" }); document.body.append(t); }
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }
  const monthLabel = (m) => { const [y, mo] = m.split("-").map(Number); const s = new Intl.DateTimeFormat(L.locale, { month: "long", year: "numeric" }).format(new Date(y, mo - 1, 1)); return s[0].toUpperCase() + s.slice(1); };
  const months = () => [...new Set(plan.rows.map(r => r.month))].sort();
  const nextMonth = (m) => { const [y, mo] = m.split("-").map(Number); const d = new Date(y, mo, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
  const videoId = (raw) => { const s = (raw || "").trim(); const m = s.match(/(?:v=|youtu\.be\/|shorts\/|live\/)([\w-]{11})/); return m ? m[1] : /^[\w-]{11}$/.test(s) ? s : null; };

  function queueSave(id, patch) {
    const row = plan.rows.find(r => r.id === id); if (row) Object.assign(row, patch);
    const p = pending.get(id) || { patch: {} };
    Object.assign(p.patch, patch);
    clearTimeout(p.timer);
    $("plan-saving").textContent = L.saving;
    p.timer = setTimeout(async () => {
      pending.delete(id);
      try { await state.db.doc("plan/" + id).update({ ...p.patch, updatedAt: new Date().toISOString() }); $("plan-saving").textContent = L.saved; }
      catch (e) { console.warn(e); $("plan-saving").textContent = L.saveErr; }
    }, 600);
    pending.set(id, p);
  }

  function cell(tag, value, onInput, attrs = {}) {
    const n = el(tag, attrs);
    if (tag === "select") { for (const [v, label] of attrs.options) n.append(el("option", { value: v, text: label })); n.removeAttribute("options"); }
    n.value = value ?? "";
    n.addEventListener(tag === "select" || attrs.type === "date" ? "change" : "input", () => onInput(n.value));
    return n;
  }

  function renderPillars() {
    const box = $("pillars"); box.replaceChildren();
    const inMonth = plan.rows.filter(r => r.month === plan.month);
    plan.pillars.forEach((p, i) => {
      const n = inMonth.filter(r => r.pillar === p.id).length;
      const input = el("input", { value: p.name, "aria-label": L.hPillar + " " + (i + 1) });
      input.value = p.name;
      input.addEventListener("change", async () => {
        plan.pillars[i] = { ...p, name: input.value.trim() || p.name };
        try { await state.db.doc("settings/pillars").set({ items: plan.pillars }); } catch (e) { console.warn(e); }
      });
      box.append(el("span", { class: "pillar-chip" }, el("span", { class: "dot", style: `background:${PILLAR_COLORS[i % 4]}` }), input,
        el("b", { class: n === PER_PILLAR ? "" : "off", text: L.slotsOf(n, PER_PILLAR) })));
    });
  }

  function renderPlan(force) {
    if (!state.db) return;
    const ms = months();
    if (!plan.month || !ms.includes(plan.month)) plan.month = ms.find(m => m >= new Date().toISOString().slice(0, 7)) || ms[ms.length - 1] || null;
    const sel = $("plan-month"); sel.replaceChildren(...ms.map(m => el("option", { value: m, text: monthLabel(m) }))); if (plan.month) sel.value = plan.month;
    renderPillars();
    const tbody = $("plan-rows");
    if (!force && tbody.contains(document.activeElement)) return;   // never yank a cell out from under the typist
    tbody.replaceChildren();
    const rows = plan.rows.filter(r => r.month === plan.month).sort((a, b) => a.slot - b.slot);
    if (!rows.length) { tbody.append(el("tr", {}, el("td", { colspan: 10, class: "empty", text: L.planEmpty }))); return; }
    const pillarOpts = [["", L.pillarNone], ...plan.pillars.map(p => [p.id, p.name])];
    const opt = (list) => [["", "—"], ...list.map((x, i) => [String(i), x])];
    for (const r of rows) {
      const save = (k) => (v) => queueSave(r.id, { [k]: v });
      const fmtN = (n) => (n == null || n === "") ? "" : f.int(n);
      const num = (k) => (v) => { const n = parseInt(String(v).replace(/[^\d]/g, ""), 10); queueSave(r.id, { [k]: Number.isFinite(n) ? n : null }); };
      const refBox = el("div", { class: "ref" });
      if (r.ref_id) refBox.append(
        el("a", { href: `https://www.youtube.com/watch?v=${r.ref_id}`, target: "_blank", rel: "noopener", text: r.ref_title || r.ref_id }),
        el("small", { text: [r.ref_channel, r.ref_ratio ? times(r.ref_ratio) : null, r.ref_views ? f.int(r.ref_views) + " " + L.colViews.toLowerCase() : null].filter(Boolean).join(" · ") }));
      const refIn = el("input", { placeholder: L.refPh, "aria-label": L.hRef });
      refIn.addEventListener("change", () => {
        const id = videoId(refIn.value); if (!id) return;
        const v = (state.data?.videos || []).find(x => x.id === id);
        const ch = v ? channelsByKey().get(v.ch) : null;
        queueSave(r.id, { ref_id: id, ref_title: v?.title || "", ref_channel: ch?.title || "", ref_ratio: v?.ratio ?? null, ref_views: v?.views ?? null });
        refIn.value = ""; renderPlan(true);
      });
      refBox.append(refIn);
      const pIdx = plan.pillars.findIndex(p => p.id === r.pillar);
      tbody.append(el("tr", {},
        el("td", { class: "n", style: pIdx >= 0 ? `box-shadow: inset 3px 0 0 ${PILLAR_COLORS[pIdx % 4]}` : null, text: r.slot }),
        el("td", {}, cell("select", r.pillar, (v) => { save("pillar")(v); renderPlan(); }, { options: pillarOpts, "aria-label": L.hPillar })),
        el("td", { class: "c-title" }, cell("textarea", r.title, save("title"), { rows: 2, "aria-label": L.hTitle })),
        el("td", {}, cell("textarea", r.pattern, save("pattern"), { rows: 2, "aria-label": L.hPattern })),
        el("td", {}, refBox),
        el("td", {}, refsCell(r)),
        el("td", {}, cell("input", fmtN(r.tam_views), num("tam_views"), { inputmode: "numeric", "aria-label": L.hTam })),
        el("td", { title: r.views_basis || L.estHelp }, el("div", { class: "est" },
          cell("input", fmtN(r.views_mid), num("views_mid"), { class: "mid", inputmode: "numeric", "aria-label": L.hExpected }),
          el("div", { class: "range" },
            cell("input", fmtN(r.views_floor), num("views_floor"), { inputmode: "numeric", placeholder: L.floorPh, "aria-label": L.floorPh }), "–",
            cell("input", fmtN(r.views_ceiling), num("views_ceiling"), { inputmode: "numeric", placeholder: L.ceilPh, "aria-label": L.ceilPh })))),
        el("td", {},
          cell("input", fmtN(r.views_real), num("views_real"), { inputmode: "numeric", "aria-label": L.hReal }),
          r.views_real && r.views_mid ? el("span", { class: "vs " + (r.views_real >= r.views_mid ? "up" : "down"), text: L.vsExpected(times(r.views_real / r.views_mid)) }) : null),
        el("td", {}, cell("select", r.status, save("status"), { options: opt(L.statuses), "aria-label": L.hStatus, class: "st" }))));
    }
  }
  const ytUrl = (id) => `https://www.youtube.com/watch?v=${id}`;
  function refFromId(id) {
    const v = (state.data?.videos || []).find(x => x.id === id);
    const ch = v ? channelsByKey().get(v.ch) : null;
    return { id, title: v?.title || "", channel: ch?.title || "", ratio: v?.ratio ?? null, views: v?.views ?? null };
  }
  function refsCell(r) {
    const box = el("div", { class: "refs" });
    const list = Array.isArray(r.format_refs) ? r.format_refs : [];
    list.forEach((x, i) => box.append(el("div", { class: "fref" },
      el("a", { href: ytUrl(x.id), target: "_blank", rel: "noopener", text: x.title || x.id }),
      el("small", { text: [x.channel, x.ratio ? times(x.ratio) : null, x.views ? f.int(x.views) + " " + L.colViews.toLowerCase() : null].filter(Boolean).join(" · ") }),
      el("button", { class: "x", type: "button", "aria-label": L.removeRef, title: L.removeRef, text: "×",
        onclick: () => { queueSave(r.id, { format_refs: list.filter((_, j) => j !== i) }); renderPlan(true); } }))));
    const add = el("input", { placeholder: L.addRefPh, "aria-label": L.addRefPh });
    add.addEventListener("change", () => {
      const id = videoId(add.value); if (!id) return;
      queueSave(r.id, { format_refs: [...list, refFromId(id)] });
      add.value = ""; renderPlan(true);
    });
    box.append(add);
    return box;
  }

  // Column widths: dragged by the viewer, remembered in this browser only.
  const COL_DEFAULTS = { n: 44, pillar: 120, title: 260, pattern: 220, ref: 240, refs: 320, tam: 120, expected: 140, real: 120, status: 120 };
  const colWidths = { ...COL_DEFAULTS, ...loadLocal("board-plan-cols", {}) };
  function applyCols() { document.querySelectorAll("#plan-cols col").forEach(c => { c.style.width = colWidths[c.dataset.col] + "px"; }); }
  applyCols();
  document.querySelectorAll(".sheet thead th").forEach((th, i) => {
    const key = document.querySelectorAll("#plan-cols col")[i].dataset.col;
    const grip = el("span", { class: "grip", title: L.resizeHint, "aria-hidden": "true" });
    grip.addEventListener("pointerdown", (e) => {
      e.preventDefault(); grip.setPointerCapture(e.pointerId); grip.classList.add("on");
      const x0 = e.clientX, w0 = colWidths[key];
      const move = (ev) => { colWidths[key] = Math.max(40, Math.round(w0 + ev.clientX - x0)); applyCols(); };
      const up = () => { grip.classList.remove("on"); grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); saveLocal("board-plan-cols", colWidths); };
      grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up);
    });
    grip.addEventListener("dblclick", () => { colWidths[key] = COL_DEFAULTS[key]; applyCols(); saveLocal("board-plan-cols", colWidths); });
    th.append(grip);
  });

  $("plan-rows").addEventListener("focusout", () => setTimeout(() => { if (!$("plan-rows").contains(document.activeElement)) renderPlan(); }, 0));
  $("plan-month").addEventListener("change", e => { plan.month = e.target.value; saveLocal("board-plan-month", plan.month); renderPlan(); });

  async function createMonth(m) {
    for (let i = 1; i <= SLOTS; i++) {
      const pillar = plan.pillars[Math.floor((i - 1) / PER_PILLAR)]?.id || "";
      try { await state.db.doc(`plan/${m}-${i}`).set({ month: m, slot: i, pillar, title: "", pattern: "", ref_id: "", format_refs: [], tam_views: null, status: "0", updatedAt: new Date().toISOString() }); }
      catch (e) { console.warn(e); toast(L.saveErr); return; }
    }
    plan.month = m; saveLocal("board-plan-month", m);
  }
  $("plan-new").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    if (btn.disabled) return;
    btn.disabled = true;   // one click, one month: a double click used to create two
    const ms = months();
    try { await createMonth(ms.length ? nextMonth(ms[ms.length - 1]) : nextMonth(new Date().toISOString().slice(0, 7))); }
    finally { btn.disabled = false; }
  });

  function addToPlan(v, ch) {
    if (!plan.month) { toast(L.noPlan); return; }
    const free = plan.rows.filter(r => r.month === plan.month && !r.ref_id).sort((a, b) => a.slot - b.slot)[0];
    if (!free) { toast(L.planFull(monthLabel(plan.month))); return; }
    queueSave(free.id, { ref_id: v.id, ref_title: v.title, ref_channel: ch?.title || "", ref_ratio: v.ratio, ref_views: v.views });
    renderPlan();
    toast(L.addedToPlan(monthLabel(plan.month), free.slot));
  }

  // ---------- events ----------
  function showView(view) {
    document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.view === view));
    $("view-videos").hidden = view !== "videos";
    $("view-list").hidden = view !== "list";
    $("view-plan").hidden = view !== "plan";
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { showView(b.dataset.view); saveLocal("board-view", b.dataset.view); }));
  $("sort").addEventListener("change", e => { state.sort = e.target.value; state.shown = PAGE; renderVideos(); });
  document.querySelectorAll("th button[data-sort]").forEach(b => b.addEventListener("click", () => { state.sort = b.dataset.sort; state.shown = PAGE; renderVideos(); }));
  $("period").addEventListener("change", e => { state.period = +e.target.value; state.shown = PAGE; renderVideos(); renderChecklist(); });
  let qt; $("q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; renderVideos(); }, 150); });
  $("ads-toggle").addEventListener("change", e => { state.hideAds = e.target.checked; saveLocal("board-hide-ads", state.hideAds); state.shown = PAGE; renderVideos(); });
  $("more").addEventListener("click", () => { state.shown += PAGE; renderVideos(); });
  $("all").addEventListener("change", e => setAll(e.target.checked));
  $("own-toggle").addEventListener("change", async e => {
    state.includeOwn = e.target.checked; renderVideos(); ensureLoaded();
    if (state.db) { try { await state.db.doc("settings/board").set({ includeOwn: state.includeOwn }); } catch {} }
    else saveLocal("board-own", state.includeOwn);
  });
  for (const s of ["side", "list"]) {
    $("add-form-" + s).addEventListener("submit", e => { e.preventDefault(); addCompetitor($("add-" + s).value, $("add-msg-" + s), $("add-" + s)); });
  }

  // ---------- boot ----------
  showView(loadLocal("board-view", "videos"));
  state.includeOwn = loadLocal("board-own", true);
  state.hideAds = loadLocal("board-hide-ads", true);
  $("ads-toggle").checked = state.hideAds;
  $("ads-label").textContent = L.hideAds(0);

  fetch("index.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { state.data = { ...d, videos: [] }; if (d.lang) setLang(d.lang); renderAll(); ensureLoaded(); })
    .catch(() => $("rows").replaceChildren(el("tr", {}, el("td", { colspan: 4, class: "empty", text: L.loadFail }))));

  (async () => {
    const db = await window.claude?.use?.("db");
    if (!db) return;
    state.db = db;
    db.collection("competitors").orderBy("addedAt").onSnapshot(snap => {
      state.roster = snap.docs.map(d => ({ key: d.id, ...d.data() }));
      renderAll(); ensureLoaded();
    }, err => console.warn("competitors", err));
    db.collection("plan").onSnapshot(snap => {
      plan.rows = snap.docs.map(d => ({ id: d.id, ...d.data(), ...(pending.get(d.id)?.patch || {}) }));
      renderPlan();
    }, err => console.warn("plan", err));
    db.doc("settings/pillars").onSnapshot(snap => {
      plan.pillars = snap.exists && Array.isArray(snap.data().items) ? snap.data().items : [];
      renderPlan();
    }, () => {});
    renderVideos();
    db.doc("settings/board").onSnapshot(snap => {
      if (snap.exists && typeof snap.data().includeOwn === "boolean") { state.includeOwn = snap.data().includeOwn; renderAll(); ensureLoaded(); }
    }, () => {});
  })();
})();
</script>

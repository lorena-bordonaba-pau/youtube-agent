name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline suite (no credentials, no quota)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyyaml

      - name: Run the offline suite
        run: python tests/test_offline.py

      - name: Every tool must print --help
        run: |
          fail=0
          for f in tools/*.py; do
            out=$(python "$f" --help 2>&1) || \
              case "$out" in
                *client_secrets*) ;;   # auth_setup needs credentials, fine
                *) echo "::error file=$f::--help failed"; echo "$out" | tail -3; fail=1 ;;
              esac
          done
          exit $fail

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No credentials committed
        run: |
          # A key in git history is the one mistake this repo cannot undo.
          if git ls-files | grep -Ei '(client_secrets|token\.pickle|^\.env$)'; then
            echo "::error::a credential file is tracked by git"
            exit 1
          fi
          if grep -rIn --exclude-dir=.git -E '(AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,})' .; then
            echo "::error::what looks like an API key is committed"
            exit 1
          fi
          echo "clean"

      - name: Config templates stay empty
        run: |
          python - <<'PY'
          import json, sys
          c = json.load(open("config/config.json"))
          if c.get("channel_context"):
              sys.exit("config/config.json ships with someone's channel context")
          l = json.load(open("config/channels_lists.json"))
          if any(l.get(k) for k in ("competencia", "inspiracion", "vecindario")):
              sys.exit("config/channels_lists.json ships with real channels")
          print("templates are empty, as they should be")
          PY

      - name: Rubrics declare they are unvalidated
        run: |
          pip install pyyaml -q
          python - <<'PY'
          import yaml, sys
          for f in ("config/rubrics/titles.yaml", "config/rubrics/thumbnails.yaml"):
              d = yaml.safe_load(open(f))
              if d.get("validated_against_ctr") is not False:
                  sys.exit(f"{f} must ship with validated_against_ctr: false")
          print("rubrics correctly declare themselves unvalidated")
          PY

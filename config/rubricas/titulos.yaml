# Rúbrica de títulos — PLANTILLA SIN CALIBRAR.
#
# En el harness original cada eje era trazable a una lección aprendida en un
# vídeo real del canal, y el campo `memoria` apuntaba al fichero que la
# justificaba. Aquí esos campos están a null: esta rúbrica es un punto de
# partida razonable, NO la destilación de las lecciones de tu canal.
#
# CÓMO CALIBRARLA (es lo que la hace valer):
#   1. Usa el harness unas semanas. Cuando descubras que algo funciona o falla
#      en TUS títulos, escríbelo en `memoria/` como un fichero de feedback.
#   2. Añade o ajusta un eje aquí, y pon en `memoria:` el nombre de ese fichero.
#   3. Sube `calibrado_con` para dejar constancia de sobre qué se calibró.
#
# Los ejes marcados GENÉRICO valen para casi cualquier canal. Los marcados
# ADAPTAR codifican una decisión editorial concreta: revísalos o bórralos, o
# estarás puntuando según el criterio de otra persona.
#
# ESTO NO PREDICE CTR. Es una lista de comprobación ponderada. Mientras no
# ingieras el CSV de Studio con el CTR real (ingest_studio_csv.py), permanece
# SIN VALIDAR y hay que decirlo al dar un score.

version: 1
calibrado_con: null
validado_contra_ctr: false

ejes:
  # GENÉRICO
  - id: gancho_al_frente
    peso: 22
    memoria: null
    descripcion: >
      El curiosity gap va en las primeras 3-4 palabras. Un paréntesis largo al
      principio entierra el gancho, y una apertura de tutorial no crea tensión.
    penalizaciones:
      - patron: '\([^)]{15,}\)'
        puntos: -12
        motivo: "Parentesis largo: puede estar enterrando el gancho"
      - patron: '^(como|cómo|guia|guía|tutorial|todo sobre)\b'
        puntos: -8
        motivo: "Apertura generica de tutorial, sin tension"

  # GENÉRICO
  - id: numero_duro
    peso: 20
    memoria: null
    descripcion: >
      Un número concreto con unidad (tiempo, %, dinero, cantidad) da
      especificidad verificable. Es de los patrones que más se repiten en
      outliers de nichos muy distintos.
    bonus:
      - patron: '\d+\s*(?:[kK%€$]|min\b|h\b|horas\b|minutos\b|d[ií]as\b|x\b)'
        puntos: 20
        motivo: "Numero duro con unidad"
      - patron: '\b\d+\b'
        puntos: 12
        motivo: "Numero presente, sin unidad explicita"

  # ADAPTAR — codifica a quién quieres atraer y a quién no.
  - id: sistema_no_herramienta
    peso: 18
    memoria: null
    descripcion: >
      EJEMPLO A ADAPTAR. En el canal original, el resultado iba delante y el
      nombre de la herramienta subordinado, y "gratis" se penalizaba porque
      atraía a un público que rebotaba. Tu canal puede querer lo contrario:
      revisa estos patrones o borra el eje.
    bonus:
      - patron: '\b(sistema|pipeline|proceso|flujo|stack|equipo)\b'
        puntos: 14
        motivo: "Encuadre de sistema"
    penalizaciones:
      - patron: '^\s*\w*\s*(gratis|free|0€|0 €)\b'
        puntos: -10
        motivo: "'Gratis' al frente: revisa si eso atrae a TU audiencia"

  # ADAPTAR — solo aplica si tu tema tiene una barrera de entrada declarable.
  - id: promesa_negativa
    peso: 12
    memoria: null
    descripcion: >
      EJEMPLO A ADAPTAR. Declarar lo que NO hace falta ("sin código", "sin
      horno", "sin experiencia") elimina la objeción principal. Cambia los
      patrones por los de tu nicho.
    bonus:
      - patron: '\bsin\s+(codigo|código|jerga|terminal|programar|saber)\b'
        puntos: 12
        motivo: "Promesa negativa explicita"

  # GENÉRICO
  - id: longitud_movil
    peso: 14
    memoria: null
    descripcion: >
      El título debe leerse entero en el feed móvil. Por encima de 60
      caracteres YouTube empieza a truncar en muchos contextos.
    rangos:
      - max: 45
        puntos: 10
        motivo: "Corto: legible, pero puede desaprovechar espacio"
      - max: 60
        puntos: 14
        motivo: "Rango optimo para movil"
      - max: 70
        puntos: 8
        motivo: "Riesgo de truncado en algunos contextos"
      - max: 999
        puntos: 2
        motivo: "Se truncara en el feed movil"

  # ADAPTAR — depende de si tu formato es en primera persona o no.
  - id: primera_persona
    peso: 14
    memoria: null
    descripcion: >
      EJEMPLO A ADAPTAR. En el canal original el mayor outlier propio era
      formato largo en primera persona, así que el molde puntuaba. Si tu canal
      es explicativo o de producto, este eje probablemente sobra.
    bonus:
      - patron: '\b(mi|mis|yo|me|monto|monte|monté|construyo|uso|hice|probe|probé)\b'
        puntos: 14
        motivo: "Primera persona"
